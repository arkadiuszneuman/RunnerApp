packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  core-js-pure: true
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js-pure
  - esbuild
  - sharp

patchedDependencies:
  # @storybook/nextjs requires('next/config'), an API Next.js 16 dropped
  # entirely — without a stub there, `pnpm storybook` fails outright. Replaces
  # apps/web's old postinstall script, which reconstructed this same file by
  # writing directly into node_modules on every install: works, but invisible
  # in a diff, silently skipped if postinstall scripts are ever disabled
  # (`pnpm config set enable-pre-post-scripts false`, or a CI running with
  # --ignore-scripts), and — since pnpm hardlinks from a shared, content-
  # addressable store — a plain fs.writeFileSync there risks mutating that
  # shared store entry for every project on the machine using this same next
  # version. A patch is applied by pnpm itself, every time, deterministically.
  next@16.3.5: patches/next@16.3.5.patch

overrides:
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  # Transitive-only vulnerable deps (ReDoS/DoS advisories) with no direct upgrade path —
  # pinned up to the patched minimum. Re-check `pnpm audit --prod` after bumping next/sass/axios.
  immutable: '>=5.1.8'
  picomatch@^2.3.1: '^2.3.2'
  picomatch@^4.0.3: '^4.0.4'
  form-data: '>=4.0.6'
  nanoid: '>=3.3.18'
  yaml@1: '>=1.10.3'
  '@babel/core': '>=7.29.1'
