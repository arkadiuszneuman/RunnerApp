services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: runnerapp
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18+ keeps its data in /var/lib/postgresql/<major>/docker, so the volume is
      # mounted on the parent. A major upgrade is a dump/restore, not just an image bump: the
      # new image refuses to start on the old major's data.
      - pg_data:/var/lib/postgresql

volumes:
  pg_data:
