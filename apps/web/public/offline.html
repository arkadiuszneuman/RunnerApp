<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <title>Offline · Runner</title>
    <!-- Served by the service worker (public/sw.js) for pages that haven't been cached for offline use. Self-contained on purpose: no build assets. -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 70% 0%, rgba(198, 255, 61, 0.12), transparent 55%), #05070c;
        color: #f3f6fb;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #c6ff3d, #38e1ff);
        box-shadow: 0 12px 32px -10px #c6ff3d;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 8px;
      }
      p {
        color: rgba(243, 246, 251, 0.62);
        line-height: 1.5;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      a,
      button {
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: inherit;
        background: rgba(255, 255, 255, 0.06);
        text-decoration: none;
        cursor: pointer;
      }
      button {
        background: #c6ff3d;
        color: #0b1200;
        border-color: transparent;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="#0b1200">
          <path
            d="M13.49 5.48c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2m-3.17 12 .57-2.5 2.1 2v5c0 .55.45 1 1 1s1-.45 1-1v-5.64c0-.55-.22-1.07-.62-1.45l-1.48-1.41.6-3c1.07 1.24 2.62 2.13 4.36 2.41.6.09 1.14-.39 1.14-1 0-.49-.36-.9-.85-.98-1.52-.25-2.78-1.15-3.45-2.33l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L7.21 7.76c-.74.32-1.22 1.04-1.22 1.85v2.37c0 .55.45 1 1 1s1-.45 1-1v-2.4l1.8-.7-1.6 8.1-3.92-.8c-.54-.11-1.07.24-1.18.78V17c-.11.54.24 1.07.78 1.18l4.11.82c1.06.21 2.1-.46 2.34-1.52"
          />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>This page hasn't been saved for offline use yet. Your home screen, programs and history open without a connection once you've used the app online.</p>
      <div class="actions">
        <a href="/">Home</a>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
