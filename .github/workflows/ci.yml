name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholder values — nothing here needs to be a real secret. The build
      # only needs DATABASE_URL to look like a valid connection string
      # (postgres.js connects lazily, on first query, not at construction);
      # no database is spun up in this job since nothing under test or built
      # here executes a real query.
      DATABASE_URL: postgresql://runner:runner@localhost:5432/runnerapp
      AUTH_SECRET: ci-placeholder-secret-not-for-production-use
      MOBILE_JWT_SECRET: ci-placeholder-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
