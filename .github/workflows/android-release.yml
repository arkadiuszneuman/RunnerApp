name: Android release

# Builds the Capacitor shell (apps/android) pointed at production, signs it with the release key and
# publishes it as runner.apk on the `android-latest` GitHub release — the "Install the app" card in
# Settings links there. The UI itself loads from the server, so the APK only changes when the native
# side does; run it by hand (workflow_dispatch) to force a rebuild.
on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - .github/workflows/android-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

env:
  CAPACITOR_SERVER_URL: https://runnerapp-rho.vercel.app
  RELEASE_TAG: android-latest

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Per runner, not the default ~/setup-pnpm (see ci.yml).
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @runner/android...

      # Regenerates the gitignored capacitor.config.json (server.url = CAPACITOR_SERVER_URL) and the
      # plugins' Gradle projects.
      - name: Capacitor sync
        run: pnpm -F @runner/android sync

      - name: Build signed APK
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — refusing to publish an unsigned APK"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/runner.apk"

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7} (run ${{ github.run_number }}). Install: open runner.apk on the phone."
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/runner.apk" --clobber
            gh release edit "$RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP/runner.apk" --target "$GITHUB_SHA" \
              --title "Android app" --notes "$notes" --latest=false
          fi
